<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesse o sistema Sincro para acompanhar sua operação de produção."
    />
    <title>Entrar</title>
    <link rel="icon" type="image/png" href="assets/Sincro.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-body">
    <main class="login-card" aria-labelledby="login-title">
      <a
        class="login-brand"
        href="index.html"
        aria-label="Voltar para o site Sincro"
      >
        <img class="login-brand-mark" src="assets/Bola.png" alt="" />
        <span class="login-brand-name">Sincro</span>
      </a>

      <header class="login-heading">
        <p class="login-kicker">Área restrita</p>
        <h1 class="login-title" id="login-title">Bem-vindo de volta.</h1>
        <p class="login-sub">Entre para acompanhar sua produção.</p>
      </header>

      <div
        class="login-erro"
        id="loginErro"
        role="alert"
        aria-live="polite"
      ></div>

      <form id="formLogin">
        <div class="login-field">
          <label class="login-label" for="inputEmail">E-mail</label>
          <input
            class="login-input"
            type="email"
            id="inputEmail"
            name="email"
            placeholder="seu@email.com"
            required
            autocomplete="email"
          />
        </div>
        <div class="login-field">
          <label class="login-label" for="inputSenha">Senha</label>
          <input
            class="login-input"
            type="password"
            id="inputSenha"
            name="senha"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="login-btn" type="submit" id="btnEntrar">Entrar</button>
      </form>
    </main>

    <script src="js/local-db.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/login.js"></script>
    <script src="js/scroll-animations.js"></script>
    <script src="js/validacao-campos.js"></script>
  </body>
</html>
